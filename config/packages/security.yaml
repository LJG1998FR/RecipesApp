security:
    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        cors_preflight:
            pattern: ^/api/
            methods: [OPTIONS]
            security: false
        refresh:
            pattern: ^/api/token/refresh
            refresh_jwt: ~
        register:
            pattern: ^/api/register
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # ── Routes publiques ────────────────────────────────────────────────────
        - { path: ^/api/login,              roles: PUBLIC_ACCESS }
        - { path: ^/api/register,           roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh,      roles: PUBLIC_ACCESS }

        # ── Liste de tous les users : SUPER_ADMIN uniquement ────────────────────
        # On restreint ici car il n'y a pas de notion de "sa propre ressource"
        # pour une liste — soit on voit tout le monde, soit on n'y a pas accès
        - { path: ^/api/users$,             roles: ROLE_SUPER_ADMIN, methods: [GET] }

        # ── Tout le reste de l'API : authentifié, la granularité est dans les controllers
        - { path: ^/api/,                   roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10