# ============================================================================
# STRUCTURE:
# - common  : generic elements (buttons, messages, errors, nav, categories, badges)
# - auth    : Authentication (login, register, logout)
# - home    : Home page (search, filters, recipe list)
# - recipe  : Recipe card, detail page, shared form, add, edit
# - profile : User profile page
# - saved   : "Saved recipes" tab
#
# BUILD: {page}.{section}.{element}
# Example: auth.login.button_submit
# (NB: for a section with a single key, {page}.{element} is tolerated rather
#  than forcing an artificial sub-section — cf. "saved.empty_state")
#
# ⚠️ This file MUST keep the exact same key structure as messages.fr.yaml.
# A key present in one file and missing in the other falls back to the raw
# key being displayed on screen (see LocaleContext.tsx -> t()).
# ============================================================================

common:
    buttons:
        save: 'Save'
        cancel: 'Cancel'
        confirm: 'Confirm'
        back: 'Back'
        close: 'Close'
        delete: 'Delete'
        edit: 'Edit'
        add: 'Add'
    messages:
