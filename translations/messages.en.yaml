home:
    greeting: 'Hello, {name} 👋'
    search_placeholder: 'Search for a recipe…'
    section_title_all: 'All recipes'
    # No built-in pluralization engine here: the singular/plural key is
    # chosen in the component. Reminder: in English "0 recipes" is PLURAL
    # (unlike French "0 recette", which is singular).
    recipe_count_singular: '{count} recipe'
    recipe_count_plural: '{count} recipes'
    empty_state: 'No recipes found'
    load_error: 'Unable to load recipes.'
    pagination:
        "per_page": 'Per page'
        "page": 'Page'
        "previous": 'Previous'
        "next": 'Next'

recipe:
    card:
        time_prep_only: '{prepTime} min.'
        time_prep_and_cook: '{prepTime} min. +{cookTime} min.'
    detail:
        stat_prep: 'Prep time'
        stat_cook: 'Cook time'
        tips_title: "Chef's tips"
        tab_ingredients: 'Ingredients'
        tab_steps: 'Steps'
    not_found:
        message: 'Recipe not found.'
        back_button: '← Back'

    # ── Shared between AddRecipePage and UpdateRecipePage (RecipeFormShared.tsx) ──
    # Deliberately DISTINCT from "recipe.detail.*" despite similar wording
    # ("Prep time", "Cook time"): these are form labels, not read-only
    # display badges. Linking them would create a fragile coupling between
    # two screens that have no reason to change together.
    form:
        title_label: 'Title'
        title_placeholder: 'e.g. Apple Tarte Tatin'
        people_label: 'Servings'
        category_label: 'Category'
        prep_label: 'Prep time'
        cook_label: 'Cook time'
        photos_label: 'Photos'
        ingredients_label: 'Ingredients'
        steps_label: 'Steps'
        tips_label: "Chef's tips"
        step_placeholder: 'Step {n}…'
        tips_placeholder: "Share your tips…\n(one tip per line)"
        add_step_button: 'Add a step'
        ingredient_singular_label: 'Ingredient'
        ingredient_search_placeholder: 'Type to search…'
        ingredient_loading: 'Loading ingredients…'
        ingredient_load_error: 'Unable to load the ingredient list. Please reload the page.'
        ingredient_no_match: 'No matching ingredient. Only an administrator can create new ones.'
        quantity_label: 'Quantity'
        quantity_placeholder: 'e.g. 250 or 1.5'
        unit_placeholder: 'unit'
        add_ingredient_button: 'Add ingredient'
        error_choose_ingredient: 'Choose an ingredient from the list.'
        error_quantity_min: 'Quantity must be a number ≥ {min}.'
        photo_alt: 'Photo {n}'
        # Specific to ExistingPhotoGrid (UpdateRecipePage): photos already
        # saved don't have a displayed order number, unlike new local
        # photos (photo_alt above).
        existing_photo_alt: 'Recipe photo'
        # Home-made plural (cf. "0 = plural in English" rule): {count} == 1 -> singular
        photo_count_singular: '{count} / {max} photo · 5 MB max each'
        photo_count_plural: '{count} / {max} photos · 5 MB max each'
        photo_error_unsupported_format: '{filename}: unsupported format'
        photo_error_too_large: '{filename}: over 5 MB'
        # Unified: AddRecipePage and UpdateRecipePage used 2 near-identical
        # phrasings without any real functional reason to differ.
        photo_error_max_reached: 'Maximum {max} photos in total: some were ignored'
        error_title_required: 'Title is required.'
        error_prep_time_invalid: 'Prep time must be a whole number of minutes (≥ 1).'
        error_cook_time_invalid: 'Cook time must be a whole number of minutes (≥ 0).'
        error_no_ingredients: 'Add at least one ingredient.'
        error_no_steps: 'Add at least one step.'
        error_step_too_long: 'Each step is limited to {max} characters.'
        # Replaces the old default hard-coded in extractMessages().
        error_generic_fallback: 'Something went wrong. Please try again.'
        error_photo_delete_failed: 'Failed to delete the photo.'

    add:
        title: 'New recipe'
        submit_button: 'Confirm submission'
        submitting: 'Submitting…'
        success_title: 'Pending review'
        success_message: '"{title}" is now awaiting moderation approval.'
        back_home_button: 'Back to home'
        photo_warning: 'The recipe was created successfully, but uploading the photos failed ({error}). You can add them later by editing the recipe.'

    update:
