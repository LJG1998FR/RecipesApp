        no_results: 'No results found.'
    errors:
        generic: 'Something went wrong. Please try again.'
        network: 'Unable to reach the server.'
        required_field: 'This field is required.'
        password:
            too_short: 'At least {min} characters'
            missing_uppercase: 'At least one uppercase letter'
            missing_lowercase: 'At least one lowercase letter'
            missing_digit: 'At least one digit'
            invalid: 'Password does not meet the required criteria.'
    nav:
        home: 'Home'
        saved: 'Saved'
        add_recipe: 'Add a recipe'
        profile: 'Profile'
    # ⚠️ These labels are for DISPLAY ONLY. The actual values ("Plats",
    # "Desserts"...) come from the backend (RecipeType.php) and are also
    # used to filter data on the front end — never replace them with these
    # translations in the filtering logic.
    categories:
        all: 'All'
        plates: 'Main dishes'
        desserts: 'Desserts'
        mocktails: 'Mocktails'
    badges:
        optional: 'optional'

